# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Publish Docker image

on:
  push:
    branches:
      - main
      - dev

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Matches the Playwright base image (Ubuntu 22.04 / Python 3.10).
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: CSS sanitiser suite
        run: python -m tests.test_guard

      - name: Queue and context suite
        run: python -m tests.test_steering

      # Dependabot bumps the base image (docker) and the pip package in separate
      # PRs and cannot see that they are one unit. Merging either alone ships an
      # image whose browsers do not match its Playwright library - and no other
      # check here would notice, because the browser suite needs a live
      # container and does not run in CI.
      - name: Playwright pin must match the base image tag
        run: |
          img=$(grep -oP 'playwright/python:v\K[0-9.]+' Dockerfile)
          pip=$(grep -oP '^playwright==\K[0-9.]+' requirements.txt)
          echo "base image: $img / pip: $pip"
          test "$img" = "$pip" || { echo "::error::Playwright version mismatch"; exit 1; }

  push_to_registry:
    name: Push Docker image to Docker Hub
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: whosmatt/slopbox
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push (multi-arch)
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/whosmatt/slopbox
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
